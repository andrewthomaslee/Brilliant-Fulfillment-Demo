apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f ../docker-compose.kompose.yml
    kompose.security-context.fsgroup: "1000"
    kompose.service.healthcheck.liveness.tcp_port: "7999"
    kompose.service.healthcheck.readiness.http_get_path: /health
    kompose.service.healthcheck.readiness.http_get_port: "7999"
    kompose.service.type: clusterip
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: bf-demo
  name: bf-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: bf-demo
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f ../docker-compose.kompose.yml
        kompose.security-context.fsgroup: "1000"
        kompose.service.healthcheck.liveness.tcp_port: "7999"
        kompose.service.healthcheck.readiness.http_get_path: /health
        kompose.service.healthcheck.readiness.http_get_port: "7999"
        kompose.service.type: clusterip
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: bf-demo
    spec:
      containers:
        - env:
            - name: DB_URI
              value: mongodb://mongo
            - name: FAKE_DATA
              value: "True"
            - name: SECRET_KEY
              value: should-be-changed
          image: andrewthomaslee/bf-demo:p9n6bvpdf2r1ghz7k9myk8bdkfws58db
          name: bf-demo
          ports:
            - containerPort: 7999
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 7999
          stdin: true
          tty: true
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
