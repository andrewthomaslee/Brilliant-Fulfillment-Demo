apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.app: mongo
  name: mongo
  namespace: bf-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      io.app: mongo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.app: mongo
    spec:
      containers:
        - image: mongo:8.0.13
          name: mongo
          ports:
            - containerPort: 27017
              protocol: TCP
          volumeMounts:
            - mountPath: /data/db
              name: mongo-data
          resources:
            limits:
              cpu: "4"
              memory: "8Gi"
            requests:
              cpu: "0.1"
              memory: "256Mi"
      restartPolicy: Always
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-data
